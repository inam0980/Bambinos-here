# Colourful Bambinos ops board theme (light, locked so the gradients always look right).
[theme]
base = "light"
primaryColor = "#7C3AED"
backgroundColor = "#F7F6FF"
secondaryBackgroundColor = "#EEF0FF"
codeBackgroundColor = "#F1EEFF"
textColor = "#1E1B4B"
linkColor = "#6D28D9"
borderColor = "#DDD6FE"
greenColor = "#10B981"
redColor = "#EF4444"
yellowColor = "#F59E0B"
orangeColor = "#F97316"
blueColor = "#3B82F6"
violetColor = "#7C3AED"
grayColor = "#6B7280"
chartCategoricalColors = ["#7C3AED", "#EC4899", "#F97316", "#10B981", "#06B6D4", "#3B82F6", "#F59E0B", "#EF4444"]
dataframeBorderColor = "#E4E0FF"
dataframeHeaderBackgroundColor = "#EDE9FE"
dataframeHeaderTextColor = "#3B0764"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "12px"
buttonRadius = "999px"
font = "'Poppins':https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
headingFont = "'Poppins':https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
codeFontSize = "12.5px"
headingFontWeights = [800, 700, 600, 600, 600, 500]
linkUnderline = false
paddingTop = "1rem"
paddingBottom = "3rem"

[theme.sidebar]
backgroundColor = "#EDE9FE"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#2E1065"
borderColor = "#C4B5FD"
primaryColor = "#7C3AED"
